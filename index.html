<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>TaskFlow</h1>
      <button id="theme-toggle" class="icon-btn">🌓</button>
    </header>

    <section class="search-filter-section">
      <input type="text" id="search-input" placeholder="タスクを検索..." class="input-field">
      <div class="filter-row">
        <select id="filter-status" class="select-field">
          <option value="all">すべて</option>
          <option value="active" selected>未完了</option>
          <option value="completed">完了済み</option>
        </select>
        <select id="sort-order" class="select-field">
          <option value="dueDate">期限順</option>
          <option value="createdAt">作成日順</option>
        </select>
      </div>
    </section>

    <main class="task-list-container">
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📝</div>
        <p>タスクがありません。<br>右下の+ボタンから追加しましょう！</p>
      </div>
    </main>

    <button id="add-task-btn" class="fab">+</button>
  </div>

  <!-- Task Modal -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">新規タスク</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title-input">タイトル</label>
          <input type="text" id="task-title-input" required class="input-field">
        </div>
        <div class="form-group">
          <label for="task-due-date">期限日</label>
          <input type="date" id="task-due-date" class="input-field">
        </div>
        <div class="form-group">
          <label for="task-reminder">リマインダー通知</label>
          <select id="task-reminder" class="select-field">
            <option value="none">通知なし</option>
            <option value="0">当日の朝 (0日前)</option>
            <option value="1">1日前</option>
            <option value="2" selected>2日前</option>
            <option value="3">3日前</option>
            <option value="7">1週間前</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn secondary">キャンセル</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
